<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Law Firm</title>
    <meta name="description" content="Sign in to the law firm portal to access your account and consultation information.">

    <link rel="stylesheet" href="Css/login.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            <a href="index.html">LAW FIRM</a>
        </div>

        <a href="index.html">Home</a>

    </header>

    <main>

        <section class="login-section">

            <div class="login-card">

                <span>SECURE PORTAL</span>

                <h1>Welcome Back</h1>

                <p>
                    Enter the email address and password associated with
                    your account to continue to the secure  portal.
                </p>

                <form id="loginForm">

                    <div class="form-group">
                        <label for="email">Email Address</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>

                        <div class="password-input">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                required
                            >
                            <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
                                <svg class="password-eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="password-eye-off" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden>
                                    <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                                    <path d="M9.9 5.2A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a16.5 16.5 0 0 1-3.1 3.8M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7c1.5 0 2.8-.4 4-1"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit">
                        Sign In
                    </button>

                    <p id="loginMessage"></p>

                </form>

                <a class="account-link" href="register.html">Create client account</a>

            </div>

        </section>

    </main>

    <script src="Js/login.js"></script>
</body>
</html>
